// the same version.txt the cmake build reads, so no platform can drift from another
def gbVersion = new File(rootDir, '../version.txt').text.trim()
def gbParts = gbVersion.tokenize('.')
def gbVersionCode = gbParts[0].toInteger() * 10000 + gbParts[1].toInteger() * 100 + gbParts[2].toInteger()

apply plugin: 'com.android.application'

def repoRoot = file('../..')
def stagedAssets = layout.buildDirectory.dir('generated/gbassets').get().asFile

android {
    namespace 'com.iediot.gbemu'
    compileSdk 35

    defaultConfig {
        applicationId "com.iediot.gbemu"
        minSdk 21
        targetSdk 35
        versionCode gbVersionCode
        versionName gbVersion

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path new File(repoRoot, 'CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // sdl's activity glue is consumed straight out of the submodule
            java.srcDirs += [new File(repoRoot, 'external/SDL/android-project/app/src/main/java')]
            assets.srcDirs = [file('src/main/assets'), stagedAssets]
        }
    }

    androidResources {
        // stored uncompressed so sdl can use the fast file descriptor asset path
        noCompress 'gb', 'png'
    }

    /* the release key is used when its passwords are in the environment, which is how
       both the workflow and tools/package-release.sh drive it. with nothing set the
       release variant stays unsigned on purpose, so it fails loudly rather than
       handing back an apk android will refuse to install */
    /* passwords come from android/keystore.properties locally and from the environment
       on ci. neither is ever committed, keystore.properties is gitignored beside the
       keystore itself */
    def gbProps = new Properties()
    def gbPropsFile = new File(rootDir, 'keystore.properties')
    if (gbPropsFile.exists()) {
        gbPropsFile.withInputStream { gbProps.load(it) }
    }
    def gbStorePass = gbProps.getProperty('storePassword') ?: System.getenv('GB_STORE_PASSWORD')
    def gbKeyAlias  = gbProps.getProperty('keyAlias')      ?: System.getenv('GB_KEY_ALIAS')
    def gbKeyPass   = gbProps.getProperty('keyPassword')   ?: System.getenv('GB_KEY_PASSWORD')
    def gbKeystore  = new File(rootDir, gbProps.getProperty('storeFile') ?: 'keystore.jks')
    signingConfigs {
        if (gbStorePass && gbKeystore.exists()) {
            release {
                storeFile gbKeystore
                storePassword gbStorePass
                keyAlias gbKeyAlias ?: 'gbemu'
                keyPassword gbKeyPass ?: gbStorePass
            }
        }
    }

    buildTypes {
        debug {
            // the ndk defaults a debug variant to -O0, which is far too slow to emulate
            // at full speed on a phone, keep the symbols but optimise
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
        release {
            if (gbStorePass && gbKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// covers, roms and sprites are staged into one folder that becomes the apk asset tree
def stageGbAssets = tasks.register('stageGbAssets', Copy) {
    into stagedAssets
    from(new File(repoRoot, 'assets/sprites')) {
        include 'cartridge.png'
    }
    from(new File(repoRoot, 'assets/artworks/gb')) {
        into 'artworks/gb'
        include '*.png'
    }
    from(new File(repoRoot, 'assets/artworks/gbc')) {
        into 'artworks/gbc'
        include '*.png'
    }
    // roms are NOT packed by default, a published apk must not carry commercial
    // cartridges. -PgbBundleRoms=true is for personal device builds only
    if (project.hasProperty('gbBundleRoms') && project.property('gbBundleRoms') == 'true') {
        from(new File(repoRoot, 'roms/game-roms')) {
            into 'game-roms'
            include '*.gb'
            include '*.gbc'
        }
    }
}

// apk assets cannot be listed at runtime, so the names are written out here instead
def writeGbManifests = tasks.register('writeGbManifests') {
    dependsOn stageGbAssets
    doLast {
        def listing = { File dir, List<String> exts ->
            def files = dir.listFiles()
            if (files == null) return ""
            files.findAll { f -> exts.any { f.name.toLowerCase().endsWith(it) } }
                 .collect { it.name }.sort().join('\n') + '\n'
        }
        new File(stagedAssets, 'artworks-gb.txt').text  = listing(new File(stagedAssets, 'artworks/gb'), ['.png'])
        new File(stagedAssets, 'artworks-gbc.txt').text = listing(new File(stagedAssets, 'artworks/gbc'), ['.png'])
        new File(stagedAssets, 'game-roms.txt').text = listing(new File(stagedAssets, 'game-roms'), ['.gb', '.gbc'])
    }
}

/* anything that reads the staged asset tree has to run after it is written. the merge
   tasks are the obvious ones, but lint vital reads it too and only runs on a release
   build, so without this assembleRelease fails a gradle dependency check that
   assembleDebug never triggers */
tasks.configureEach { t ->
    if ((t.name.startsWith('merge') && t.name.endsWith('Assets')) ||
        t.name.toLowerCase().contains('lint')) {
        t.dependsOn writeGbManifests
    }
}
