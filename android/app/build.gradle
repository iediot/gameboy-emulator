apply plugin: 'com.android.application'

def repoRoot = file('../..')
def stagedAssets = layout.buildDirectory.dir('generated/gbassets').get().asFile

android {
    namespace 'com.iediot.gbemu'
    compileSdk 35

    defaultConfig {
        applicationId "com.iediot.gbemu"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path new File(repoRoot, 'CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // sdl's activity glue is consumed straight out of the submodule
            java.srcDirs += [new File(repoRoot, 'external/SDL/android-project/app/src/main/java')]
            assets.srcDirs = [file('src/main/assets'), stagedAssets]
        }
    }

    androidResources {
        // stored uncompressed so sdl can use the fast file descriptor asset path
        noCompress 'gb', 'png'
    }

    buildTypes {
        debug {
            // the ndk defaults a debug variant to -O0, which is far too slow to emulate
            // at full speed on a phone, keep the symbols but optimise
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// covers, roms and sprites are staged into one folder that becomes the apk asset tree
def stageGbAssets = tasks.register('stageGbAssets', Copy) {
    into stagedAssets
    from(new File(repoRoot, 'assets/sprites')) {
        include 'cartridge.png'
    }
    from(new File(repoRoot, 'assets/artworks/gb')) {
        into 'artworks/gb'
        include '*.png'
    }
    from(new File(repoRoot, 'assets/artworks/gbc')) {
        into 'artworks/gbc'
        include '*.png'
    }
    from(new File(repoRoot, 'roms/game-roms')) {
        into 'game-roms'
        include '*.gb'
        include '*.gbc'
    }
}

// apk assets cannot be listed at runtime, so the names are written out here instead
def writeGbManifests = tasks.register('writeGbManifests') {
    dependsOn stageGbAssets
    doLast {
        def listing = { File dir, List<String> exts ->
            def files = dir.listFiles()
            if (files == null) return ""
            files.findAll { f -> exts.any { f.name.toLowerCase().endsWith(it) } }
                 .collect { it.name }.sort().join('\n') + '\n'
        }
        new File(stagedAssets, 'artworks-gb.txt').text  = listing(new File(stagedAssets, 'artworks/gb'), ['.png'])
        new File(stagedAssets, 'artworks-gbc.txt').text = listing(new File(stagedAssets, 'artworks/gbc'), ['.png'])
        new File(stagedAssets, 'game-roms.txt').text = listing(new File(stagedAssets, 'game-roms'), ['.gb', '.gbc'])
    }
}

tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) {
        t.dependsOn writeGbManifests
    }
}
